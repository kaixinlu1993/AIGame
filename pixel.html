<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#241833">
  <meta name="description" content="像素横板闯关。左右跳，躲开刺和虫子，把小模型送到旗子那里。">
  <title>像素闯关</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23241833' width='64' height='64'/%3E%3Crect x='18' y='16' width='28' height='22' fill='%23f6e39a'/%3E%3Crect x='22' y='36' width='20' height='14' fill='%23e85d4c'/%3E%3Crect x='24' y='24' width='6' height='6'/%3E%3Crect x='36' y='24' width='6' height='6'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/ZCOOLKuaiLe-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/hall.css">
  <link rel="stylesheet" href="css/pixel.css">
</head>
<body>
  <div class="pixel-app">
    <a class="hall-link" href="./">← 游戏厅</a>
    <header class="pixel-top">
      <div>
        <p class="eyebrow" id="level-kicker">第 1 关 · 出门</p>
        <h1>像素闯关</h1>
      </div>
      <p class="balance">代币 <strong id="coins">0</strong></p>
    </header>
    <div class="stage">
      <canvas id="view" width="320" height="180" aria-label="像素闯关画面"></canvas>
      <section id="card" class="pixel-card">
        <p class="eyebrow" id="card-kicker">2D 横板</p>
        <h2 id="card-title">把小模型送到旗子那里</h2>
        <p id="card-copy">方向键或 A D 移动，空格跳跃。屏幕下面的按钮也能玩。刺不能碰，虫子可以从头上踩过去。</p>
        <button id="card-go" class="pixel-go" type="button">开始闯关</button>
      </section>
    </div>
    <p id="note" class="pixel-note">三关。看到空了就跳。</p>
    <div class="pad">
      <button type="button" data-hold="left" aria-label="向左">←</button>
      <button type="button" data-hold="right" aria-label="向右">→</button>
      <button type="button" data-hold="jump" aria-label="跳">跳</button>
    </div>
  </div>
  <script type="module" src="js/pixel.js"></script>
</body>
</html>
