<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1511">
  <meta name="description" content="小游戏厅。合成大模型、猜大小，还有一关像素横板。">
  <title>小游戏厅</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f6e39a'/%3E%3Ccircle cx='23' cy='28' r='4'/%3E%3Ccircle cx='41' cy='28' r='4'/%3E%3Cpath d='M20 40c4 6 20 6 24 0' fill='none' stroke='%23241c14' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/ZCOOLKuaiLe-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/hall.css">
</head>
<body>
  <main class="hall">
    <header class="hall-head">
      <p class="eyebrow">三个小游戏</p>
      <h1>小游戏厅</h1>
      <p class="deck">第一个是已经选好的游戏。后面是猜大小，和一关像素横板。</p>
    </header>
    <a class="pick featured" href="hecheng.html">
      <span class="badge">先玩这个</span>
      <span class="num">01</span>
      <h2>合成大模型</h2>
      <p>两个一样的模型撞在一起，合成一个更大、更自信、更不讲理的。</p>
      <span class="go">开始</span>
    </a>
    <a class="pick" href="caidaxiao.html">
      <span class="num">02</span>
      <h2>猜大小</h2>
      <p>开局 10 分钟倒计时。三个数字相加，押大、小、单、双，或者豹子。</p>
      <span class="go">去押</span>
    </a>
    <a class="pick" href="pixel.html">
      <span class="num">03</span>
      <h2>像素闯关</h2>
      <p>2D 横板。左右跳，躲开刺和虫子，把小模型送到旗子那里。</p>
      <span class="go">去跳</span>
    </a>
  </main>
</body>
</html>
